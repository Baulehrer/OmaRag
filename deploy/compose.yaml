services:
  omaragd:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: ghcr.io/baulehrer/oracle-of-daedalus:0.8.0
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8765"
      - --token
      - ${OMARAG_TOKEN:?OMARAG_TOKEN muss gesetzt sein}
    environment:
      OMARAG_OLLAMA_URL: http://host.docker.internal:11434
      MALLOC_ARENA_MAX: "2"
      MALLOC_TRIM_THRESHOLD_: "131072"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "4"
      NUMEXPR_NUM_THREADS: "4"
      RAYON_NUM_THREADS: "4"
    ports:
      - "127.0.0.1:${OMARAG_PORT:-8765}:8765"
    volumes:
      - oracle-data:/var/lib/oracle-of-daedalus
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped
    mem_limit: 10g
    memswap_limit: 12g
    cpus: 4.0
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/v1/health', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

volumes:
  oracle-data:
