name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          enable-cache: true
      - name: Rust quality gates
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace --all-targets --locked
      - name: Python quality gates
        working-directory: python
        run: |
          uv sync --locked --extra dev --extra mcp
          .venv/bin/ruff check omarag_bridge tests
          .venv/bin/ruff format --check omarag_bridge tests
          .venv/bin/pytest -q
      - name: Contract drift
        run: |
          PYTHONPATH=python python/.venv/bin/python scripts/generate_contracts.py
          git diff --exit-code -- api

  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Build CPU image
        run: docker build --build-arg VERSION=0.5.0 -f deploy/Dockerfile -t oracle:test .
      - name: Verify non-root runtime
        run: test "$(docker run --rm --entrypoint id oracle:test -u)" != "0"
