[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "omarag-bridge"
version = "0.7.0"
description = "Oracle of Daedalus API-first bridge daemon for Haiku RAG"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pillow>=11,<13",
  "pypdfium2>=5,<6",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "tomli-w>=1.2,<2",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
haiku = [
  # Deliberately no upper bound: the installer stages the newest stable
  # vanilla release and activates it only after the public-API contract probe.
  # Install only the providers Oracle uses; the full meta-package also pulls
  # cloud providers and another TUI into the local daemon environment.
  "haiku-rag-slim[docling,cross-encoder]>=0.72",
  # Direct entries keep uv's explicit CPU index authoritative for transitives.
  "torch",
  "torchvision",
]
dev = [
  "httpx2>=2,<3",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.9,<1",
]
mcp = [
  "httpx>=0.27,<1",
  "mcp>=1.12,<2",
]

[project.scripts]
omaragd = "omarag_bridge.main:cli"
oracle-daedalusd = "omarag_bridge.main:cli"
omarag-mcp = "omarag_bridge.mcp_server:main"

[project.urls]
Homepage = "https://github.com/Baulehrer/oracle-of-daedalus"
Issues = "https://github.com/Baulehrer/oracle-of-daedalus/issues"

[tool.hatch.build.targets.wheel]
packages = ["omarag_bridge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "haiku_e2e: requires Haiku RAG, a running Ollama and OMARAG_E2E_PDF",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
